name: E2E Smoke

# Triggers on Vercel deployment_status events. Vercel fires this when a
# preview deploy completes; the workflow filters to `state == success` +
# `environment == Preview` so it doesn't run on production deploys or
# in-progress builds. The preview URL comes straight from the event
# payload — no Vercel API call needed, no env-var rotation per PR.

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  e2e:
    name: Playwright smoke
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      E2E_AUTH_BYPASS_SECRET: ${{ secrets.E2E_AUTH_BYPASS_SECRET }}
      # Mirrors GUIDED_READ_STORE on the Vercel Preview runtime. The
      # Playwright smoke branches on this to assert the right surface
      # (supabase = seeded "Steady Tide"; anything else = configured-error).
      # Override via repo variable `GUIDED_READ_STORE` if Preview's value
      # ever diverges from the current "supabase" default.
      GUIDED_READ_STORE: ${{ vars.GUIDED_READ_STORE || 'supabase' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright smoke
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
